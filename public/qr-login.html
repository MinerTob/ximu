<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>请使用析木聊天室登录</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: linear-gradient(135deg, #eef2ff 0%, #f6f7fb 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2937;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(30, 40, 80, 0.12);
      padding: 40px 28px;
      text-align: center;
    }
    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, #4c7dff, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      box-shadow: 0 8px 20px rgba(76, 125, 255, 0.35);
    }
    h1 { font-size: 22px; margin-bottom: 14px; }
    p { font-size: 15px; line-height: 1.8; color: #4b5563; margin-bottom: 12px; }
    .tip {
      display: inline-block;
      font-size: 13px;
      color: #6b7280;
      background: #f3f4f6;
      border-radius: 20px;
      padding: 6px 14px;
    }
    .steps {
      text-align: left;
      background: #f8faff;
      border: 1px solid #e5e9f0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.9;
      color: #374151;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">💬</div>
    <h1>请使用析木聊天室登录</h1>
    <p>这个二维码只用于「析木聊天室」的扫码登录，其他扫码工具无法完成登录。</p>
    <div class="steps">
      正确做法：<br>
      1. 打开析木聊天室并登录你的账号；<br>
      2. 点击左上角头像进入个人资料；<br>
      3. 点击头像右侧的扫码图标；<br>
      4. 扫描屏幕上的二维码即可快速登录。
    </div>
    <span class="tip">误扫提示 · 请使用析木聊天室</span>
  </div>
</body>
</html>
